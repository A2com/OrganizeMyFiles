[package]
name = "OrganizeMyFiles"
version = "0.3.1"
edition = "2021"

[dependencies]
eframe = "=0.29.1"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "9"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
tray-icon = "0.21"
muda = "0.17"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSImage", "NSResponder", "NSRunningApplication", "NSView", "NSControl", "NSSwitch", "NSTextField", "NSImageView", "NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSObject", "NSAppleEventManager", "NSAppleEventDescriptor"] }

[package]
name = "file-organizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "=0.29.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"

[profile.release]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
tray-icon = "0.21"

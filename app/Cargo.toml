[package]
name = "file-organizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "=0.29.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
unicode-normalization = "0.1"

[profile.release]
opt-level = 2
